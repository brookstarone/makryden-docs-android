name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Decode keystore
        run: echo "${{ secrets.MKDOCS_KEYSTORE_BASE64 }}" | base64 -d > /tmp/makryden-docs.keystore
      - name: Build unsigned release
        run: gradle assembleRelease --no-daemon
      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks /tmp/makryden-docs.keystore \
            --ks-pass:env MKDOCS_KEYSTORE_PASSWORD \
            --key-pass:env MKDOCS_KEY_PASSWORD \
            --ks-key-alias $MKDOCS_KEY_ALIAS \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          MKDOCS_KEYSTORE_PASSWORD: ${{ secrets.MKDOCS_KEYSTORE_PASSWORD }}
          MKDOCS_KEY_PASSWORD: ${{ secrets.MKDOCS_KEY_PASSWORD }}
          MKDOCS_KEY_ALIAS: ${{ secrets.MKDOCS_KEY_ALIAS }}
      - uses: actions/upload-artifact@v4
        with:
          name: makryden-docs-apk
          path: app/build/outputs/apk/release/app-release-signed.apk
