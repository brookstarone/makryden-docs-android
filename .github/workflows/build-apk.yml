name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Decode keystore
        run: echo "${{ secrets.MKDOCS_KEYSTORE_BASE64 }}" | base64 -d > /tmp/makryden-docs.keystore
      - run: gradle assembleRelease --no-daemon
        env:
          MKDOCS_KEYSTORE_PATH: /tmp/makryden-docs.keystore
          MKDOCS_KEYSTORE_PASSWORD: ${{ secrets.MKDOCS_KEYSTORE_PASSWORD }}
          MKDOCS_KEY_ALIAS: ${{ secrets.MKDOCS_KEY_ALIAS }}
          MKDOCS_KEY_PASSWORD: ${{ secrets.MKDOCS_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: makryden-docs-apk
          path: app/build/outputs/apk/release/*.apk
